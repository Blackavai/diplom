services:
  postgres:
    # Меняем версию на 17-alpine для совместимости с бэкапом
    image: postgres:17-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./itk_old.sql:/docker-entrypoint-initdb.d/init_backup.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: node_app
    restart: always
    ports:
      # Пробрасываем свободный порт 5001 наружу
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      # Container-to-container connections use the internal PostgreSQL port.
      DB_PORT: "5432"
      JWT_SECRET: ${JWT_SECRET}
      # Передаем значение 5001 внутрь Node.js приложения
      PORT: ${BACKEND_PORT}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vite_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT}:80"
    environment:
      API_UPSTREAM: http://app:${BACKEND_PORT}
    depends_on:
      - app

volumes:
  pgdata:
